name: Horaires TER

on:
  schedule:
    # Une fois par jour, 3h UTC. Les horaires théoriques changent peu.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  horaires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Relever les horaires TER
        run: python collector/ter.py

      - name: Enregistrer dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Horaires TER du $(TZ=Europe/Paris date +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
