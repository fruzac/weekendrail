name: Collecte

on:
  schedule:
    # Heures UTC. La SNCF publie l'open data « tgvmax » une fois par jour, vers 6h30 (heure de Paris).
    # Quatre relevés le matin (4h40, 5h10, 5h40, 6h10 UTC), qui couvrent la publication en heure
    # d'été comme en heure d'hiver, puis deux de rattrapage si elle sort plus tard (10h et 16h UTC).
    - cron: "40 4,5 * * *"
    - cron: "10 5,6 * * *"
    - cron: "0 10,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Relever les places MAX JEUNE
        run: python collector/collect.py

      - name: Calculer les chances de passer à 0€
        run: python collector/stats.py

      - name: Enregistrer la photo dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Relevé du $(TZ=Europe/Paris date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
