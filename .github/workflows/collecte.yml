name: Collecte

on:
  schedule:
    # Heures UTC. La SNCF publie l'open data « tgvmax » une fois par jour, tôt le matin.
    # On relève toutes les 30 minutes de 4h à 22h (heure de Paris) : le relevé part dès que
    # la publication sort, et si la SNCF republie dans la journée, le site suit dans la demi-heure.
    - cron: "*/30 2-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Relever les places MAX JEUNE
        run: python collector/collect.py

      - name: Calculer les chances de passer à 0€
        run: python collector/stats.py

      - name: Enregistrer la photo dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Relevé du $(TZ=Europe/Paris date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
