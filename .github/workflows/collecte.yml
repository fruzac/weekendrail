name: Collecte quotidienne

on:
  schedule:
    # Heures UTC. La SNCF a publié la mise à jour du 14 octobre vers 12h (heure de Paris),
    # donc on relève le matin, puis plusieurs fois en début d'après midi et le soir.
    - cron: "15 4 * * *"
    - cron: "15 8 * * *"
    - cron: "30 10 * * *"
    - cron: "30 12 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Relever les places MAX JEUNE
        run: python collector/collect.py

      - name: Enregistrer la photo dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Relevé du $(TZ=Europe/Paris date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
