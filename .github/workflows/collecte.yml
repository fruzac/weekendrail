name: Collecte

on:
  schedule:
    # Heures UTC. La SNCF publie l'open data « tgvmax » une fois par jour, vers 6h30 (heure de Paris).
    # Quatre relevés le matin (4h43, 5h17, 5h38, 6h13 UTC), qui couvrent la publication en heure
    # d'été comme en heure d'hiver, puis deux de rattrapage si elle sort plus tard (10h22 et 16h47 UTC).
    # Minutes volontairement irrégulières : on évite les heures rondes, où tout le monde interroge
    # l'open data et où GitHub retarde le plus les tâches programmées.
    - cron: "43 4 * * *"
    - cron: "17 5 * * *"
    - cron: "38 5 * * *"
    - cron: "13 6 * * *"
    - cron: "22 10 * * *"
    - cron: "47 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Relever les places MAX JEUNE
        run: python collector/collect.py

      - name: Calculer les chances de passer à 0€
        run: python collector/stats.py

      - name: Enregistrer la photo dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Relevé du $(TZ=Europe/Paris date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
